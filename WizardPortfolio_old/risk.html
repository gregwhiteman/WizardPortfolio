<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Management - D&D Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Text', serif;
            background: 
                radial-gradient(circle at 20% 50%, rgba(20, 20, 20, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(15, 15, 15, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(10, 10, 10, 0.3) 0%, transparent 50%),
                linear-gradient(135deg, #000000 0%, #050505 25%, #0a0a0a 50%, #0f0f0f 75%, #000000 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 25% 25%, rgba(100, 100, 100, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(80, 80, 80, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Glowing runes background styles */
        .runes-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .rune {
            position: absolute;
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: bold;
            opacity: 0.3;
            animation: runeGlow 4s ease-in-out infinite;
            text-shadow: 0 0 10px currentColor;
        }

        .red-rune {
            color: #ff4444;
            text-shadow: 0 0 15px #ff4444, 0 0 30px #ff4444;
        }

        .green-rune {
            color: #44ff44;
            text-shadow: 0 0 15px #44ff44, 0 0 30px #44ff44;
        }

        .gold-rune {
            color: #ffd700;
            text-shadow: 0 0 15px #ffd700, 0 0 30px #ffd700;
        }

        @keyframes runeGlow {
            0%, 100% { 
                opacity: 0.2; 
                transform: scale(1) rotate(0deg);
            }
            50% { 
                opacity: 0.6; 
                transform: scale(1.1) rotate(5deg);
            }
        }

        /* Rune symbols for magical effect */
        .rune-symbols {
            font-size: 1.5rem;
        }

        /* Lightning bolt styles */
        .lightning-bolt {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: lightningFlash 0.8s ease-in-out;
        }

        .lightning-segment {
            position: absolute;
            background: currentColor;
            border-radius: 1px;
            box-shadow: 0 0 5px currentColor, 0 0 10px currentColor, 0 0 15px currentColor;
        }

        .red-lightning {
            color: #ff4444;
        }

        .green-lightning {
            color: #44ff44;
        }

        .gold-lightning {
            color: #ffd700;
        }

        @keyframes lightningFlash {
            0% { opacity: 0; }
            5% { opacity: 1; }
            15% { opacity: 0.7; }
            25% { opacity: 1; }
            35% { opacity: 0.8; }
            45% { opacity: 1; }
            55% { opacity: 0.6; }
            65% { opacity: 1; }
            75% { opacity: 0.9; }
            85% { opacity: 1; }
            95% { opacity: 0.3; }
            100% { opacity: 0; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 
                2px 2px 0px #333,
                4px 4px 8px rgba(0, 0, 0, 0.8);
            background: linear-gradient(45deg, #e0e0e0, #f0f0f0, #d0d0d0, #c0c0c0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-link {
            color: #ccc;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            margin: 0 10px;
            padding: 10px 20px;
            border-radius: 8px;
            background: rgba(15, 15, 15, 0.8);
            border: 2px solid rgba(20, 20, 20, 0.5);
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .nav-link:hover {
            background: rgba(20, 20, 20, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(100, 100, 100, 0.3);
        }

        .data-container {
            background: 
                linear-gradient(145deg, rgba(15, 15, 15, 0.6) 0%, rgba(20, 20, 20, 0.5) 50%, rgba(10, 10, 10, 0.6) 100%);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 
                0 0 30px rgba(100, 100, 100, 0.2),
                inset 0 0 20px rgba(0, 0, 0, 0.5),
                0 8px 32px rgba(0, 0, 0, 0.8);
            border: 3px solid rgba(20, 20, 20, 0.5);
            position: relative;
            opacity: 0.85;
        }

        .data-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: rgba(20, 20, 20, 0.5);
            border-radius: 17px;
            z-index: -1;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Cinzel', serif;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4a90e2 0%, #7bb3f0 100%);
            border-color: #4a90e2;
            color: white;
        }

        .btn-success {
            background: linear-gradient(45deg, #27ae60 0%, #2ecc71 100%);
            border-color: #27ae60;
            color: white;
        }

        .btn-danger {
            background: linear-gradient(45deg, #e74c3c 0%, #c0392b 100%);
            border-color: #e74c3c;
            color: white;
        }

        .btn-warning {
            background: linear-gradient(45deg, #f39c12 0%, #e67e22 100%);
            border-color: #f39c12;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .table-container {
            overflow-x: auto;
            border-radius: 10px;
            background: 
                linear-gradient(145deg, rgba(30, 30, 30, 0.8), rgba(40, 40, 40, 0.6));
            border: 2px solid rgba(20, 20, 20, 0.5);
            box-shadow: 
                inset 0 2px 4px rgba(0, 0, 0, 0.5),
                0 4px 8px rgba(0, 0, 0, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(15, 15, 15, 0.5);
        }

        th, td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid rgba(100, 100, 100, 0.3);
            font-family: 'Crimson Text', serif;
            color: #e0e0e0;
        }

        th {
            background: 
                linear-gradient(145deg, rgba(30, 30, 30, 0.9), rgba(40, 40, 40, 0.7));
            font-weight: bold;
            font-family: 'Cinzel', serif;
            color: #ccc;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            position: sticky;
            top: 0;
            border-bottom: 2px solid rgba(20, 20, 20, 0.5);
        }

        tr:hover {
            background: rgba(100, 100, 100, 0.1);
        }

        .risk-level {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            text-align: center;
            padding: 4px 8px;
            border-radius: 4px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }

        .risk-1 { background: rgba(39, 174, 96, 0.3); color: #27ae60; }
        .risk-2 { background: rgba(46, 204, 113, 0.3); color: #2ecc71; }
        .risk-3 { background: rgba(52, 152, 219, 0.3); color: #3498db; }
        .risk-4 { background: rgba(155, 89, 182, 0.3); color: #9b59b6; }
        .risk-5 { background: rgba(241, 196, 15, 0.3); color: #f1c40f; }
        .risk-6 { background: rgba(230, 126, 34, 0.3); color: #e67e22; }
        .risk-7 { background: rgba(231, 76, 60, 0.3); color: #e74c3c; }
        .risk-8 { background: rgba(192, 57, 43, 0.3); color: #c0392b; }
        .risk-9 { background: rgba(142, 68, 173, 0.3); color: #8e44ad; }

        input, select {
            background: rgba(30, 30, 30, 0.9);
            border: 2px solid rgba(20, 20, 20, 0.5);
            border-radius: 8px;
            padding: 10px;
            color: #e0e0e0;
            width: 100%;
            font-family: 'Crimson Text', serif;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(100, 100, 100, 0.5);
            border-color: #aaa;
        }

        input::placeholder {
            color: rgba(224, 224, 224, 0.6);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: 
                linear-gradient(145deg, rgba(30, 30, 30, 0.95) 0%, rgba(40, 40, 40, 0.9) 50%, rgba(20, 20, 20, 0.95) 100%),
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="parchment" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="4" height="4" fill="%23666" opacity="0.1"/><circle cx="2" cy="2" r="0.5" fill="%23444" opacity="0.2"/></pattern></defs><rect width="100" height="100" fill="url(%23parchment)"/></svg>');
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 
                0 0 30px rgba(100, 100, 100, 0.2),
                inset 0 0 20px rgba(0, 0, 0, 0.5),
                0 20px 60px rgba(0, 0, 0, 0.8);
            border: 3px solid rgba(20, 20, 20, 0.5);
            position: relative;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: rgba(20, 20, 20, 0.5);
            border-radius: 17px;
            z-index: -1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-family: 'Cinzel', serif;
            color: #ccc;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .close {
            color: #ccc;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .close:hover {
            color: #fff;
            transform: scale(1.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-family: 'Cinzel', serif;
            color: #ccc;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .actions .btn {
            flex: 1;
        }

        .risk-description {
            font-size: 0.9rem;
            color: #ccc;
            margin-top: 5px;
            font-style: italic;
        }

        /* Lightning toggle button styles */
        .lightning-toggle-btn {
            color: #ccc;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            margin: 0 10px;
            padding: 10px 20px;
            border-radius: 8px;
            background: rgba(15, 15, 15, 0.8);
            border: 2px solid rgba(20, 20, 20, 0.5);
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .lightning-toggle-btn:hover {
            background: rgba(20, 20, 20, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(100, 100, 100, 0.3);
        }

        .lightning-toggle-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .lightning-toggle-btn:hover::before {
            left: 100%;
        }

        .lightning-toggle-btn.active {
            background: linear-gradient(45deg, #ffd700 0%, #ffed4e 100%);
            border-color: #ffd700;
            color: #000;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .lightning-toggle-btn.active:hover {
            background: linear-gradient(45deg, #ffed4e 0%, #ffd700 100%);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.7);
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            
            .form-row {
                flex-direction: column;
            }
            
            .actions {
                flex-direction: column;
            }
            
            table {
                font-size: 0.9rem;
            }
            
            th, td {
                padding: 8px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Risk Management</h1>
            <div>
                <a href="index.html" class="nav-link">← Back to Home</a>
                <a href="data.html" class="nav-link">📊 Portfolio</a>
                <a href="buy-sell.html" class="nav-link">💰 Buy/Sell</a>
                <a href="#" class="nav-link" onclick="exportRiskData()">Export Data</a>
                <a href="#" class="nav-link" onclick="importRiskData()">Import Data</a>
                <button class="lightning-toggle-btn" id="lightningToggleBtn" onclick="toggleLightning()">⚡</button>
            </div>
        </div>

        <div class="data-container">
            <div class="controls">
                <button class="btn btn-primary" onclick="openAddModal()">Add New Ticker</button>
                <!-- <button class="btn btn-warning" onclick="loadDefaultRiskData()">Load Default Risk Data</button> -->
                <!-- <button class="btn btn-danger" onclick="clearAllRiskData()">Clear All Data</button> -->
            </div>

            <div class="table-container">
                <table id="riskTable">
                    <thead>
                        <tr>
                            <th>Ticker Symbol</th>
                            <th>Risk Level</th>
                            <th>Risk Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="riskTableBody">
                        <!-- Data will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="riskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Ticker</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="riskForm">
                <div class="form-group">
                    <label for="ticker">Ticker Symbol:</label>
                    <input type="text" id="ticker" name="ticker" placeholder="e.g., TSLA" required style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label for="riskLevel">Risk Level (1-9):</label>
                    <select id="riskLevel" name="riskLevel" required>
                        <option value="">Select Risk Level</option>
                        <option value="1">1 - Very Low Risk (Cash, Bonds)</option>
                        <option value="2">2 - Low Risk (Blue Chip Stocks)</option>
                        <option value="3">3 - Low-Medium Risk (Stable Companies)</option>
                        <option value="4">4 - Medium Risk (Established Companies)</option>
                        <option value="5">5 - Medium Risk (Growth Stocks)</option>
                        <option value="6">6 - Medium-High Risk (Volatile Stocks)</option>
                        <option value="7">7 - High Risk (Speculative Stocks)</option>
                        <option value="8">8 - Very High Risk (Penny Stocks)</option>
                        <option value="9">9 - Extreme Risk (Crypto, Meme Stocks)</option>
                    </select>
                    <div class="risk-description" id="riskDescription"></div>
                </div>
                <div class="actions">
                    <button type="button" class="btn btn-primary" onclick="saveRiskEntry()">Save</button>
                    <button type="button" class="btn btn-danger" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="handleFileImport(event)">

    <script>
        let riskData = [];
        let editingIndex = -1;

        // Risk level descriptions
        const riskDescriptions = {
            1: "Very Low Risk - Cash, Government Bonds, Money Market",
            2: "Low Risk - Blue Chip Stocks, Large Cap Dividend Stocks",
            3: "Low-Medium Risk - Stable Companies, REITs, Utilities",
            4: "Medium Risk - Established Companies, Mid-Cap Stocks",
            5: "Medium Risk - Growth Stocks, Technology Companies",
            6: "Medium-High Risk - Volatile Stocks, Small Cap Growth",
            7: "High Risk - Speculative Stocks, Biotech, Emerging Markets",
            8: "Very High Risk - Penny Stocks, Micro-Cap, Startups",
            9: "Extreme Risk - Cryptocurrency, Meme Stocks, Options"
        };

        // Default risk data based on your current portfolio
        const defaultRiskData = [
            { ticker: 'CASH', riskLevel: 1 },
            { ticker: 'PHYS', riskLevel: 3 },
            { ticker: 'XXRP', riskLevel: 9 },
            { ticker: 'PLTR', riskLevel: 6 },
            { ticker: 'TSLA', riskLevel: 7 }
        ];

        // Rune symbols for magical effect
        const runeSymbols = ['ᚠ', 'ᚢ', 'ᚦ', 'ᚨ', 'ᚱ', 'ᚲ', 'ᚷ', 'ᚹ', 'ᚺ', 'ᚾ', 'ᛁ', 'ᛃ', 'ᛇ', 'ᛈ', 'ᛉ', 'ᛊ', 'ᛏ', 'ᛒ', 'ᛖ', 'ᛗ', 'ᛚ', 'ᛜ', 'ᛞ', 'ᛟ'];

        // Create glowing runes in the background
        function createRunes(runeType, count = 15) {
            const runesBackground = document.getElementById('runesBackground');
            
            // Clear existing runes
            runesBackground.innerHTML = '';
            
            for (let i = 0; i < count; i++) {
                const rune = document.createElement('div');
                rune.className = `rune ${runeType}-rune rune-symbols`;
                
                // Random rune symbol
                const symbol = runeSymbols[Math.floor(Math.random() * runeSymbols.length)];
                rune.textContent = symbol;
                
                // Random position
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                rune.style.left = x + '%';
                rune.style.top = y + '%';
                
                // Random animation delay
                rune.style.animationDelay = Math.random() * 4 + 's';
                
                // Random size variation
                const size = 1.5 + Math.random() * 1;
                rune.style.fontSize = size + 'rem';
                
                runesBackground.appendChild(rune);
            }
        }

        // Update runes background based on Today's Change percentage intensity
        function updateRunesBackground() {
            // Load portfolio data to check Today's Change percentage
            const portfolioData = loadPortfolioData();
            if (!portfolioData || portfolioData.length === 0) {
                // Gold runes if no data
                createRunes('gold', 50);
                const lightningEnabled = localStorage.getItem('lightningEnabled') === 'true';
                if (lightningEnabled) {
                    startLightningBolts('gold', 1);
                }
                return;
            }

            // Calculate portfolio stats
            const stats = calculatePortfolioStats(portfolioData);
            const todayChangePercent = Math.abs(stats.todayChange); // Today's Change percentage
            
            // Calculate intensity multiplier based on Today's Change percentage magnitude
            let intensityMultiplier = 1;
            if (todayChangePercent > 5) {
                intensityMultiplier = 3; // Very high volatility (>5% change)
            } else if (todayChangePercent > 3) {
                intensityMultiplier = 2.5; // High volatility (>3% change)
            } else if (todayChangePercent > 1) {
                intensityMultiplier = 2; // Medium volatility (>1% change)
            } else if (todayChangePercent > 0.5) {
                intensityMultiplier = 1.5; // Low volatility (>0.5% change)
            }
            
            // Base rune count
            const baseRuneCount = 50;
            const runeCount = Math.floor(baseRuneCount * intensityMultiplier);
            
            // Check if lightning is enabled
            const lightningEnabled = localStorage.getItem('lightningEnabled') === 'true';
            
            if (stats.todayChange > 1) {
                // Green runes for positive Today's Change - more intense for higher percentages
                createRunes('green', runeCount);
                if (lightningEnabled) {
                    startLightningBolts('green', intensityMultiplier);
                }
            } else if (stats.todayChange < -1) {
                // Red runes for negative Today's Change - more intense for higher absolute percentages
                createRunes('red', runeCount);
                if (lightningEnabled) {
                    startLightningBolts('red', intensityMultiplier);
                }
            } else {
                // Gold runes for stable performance
                createRunes('gold', runeCount);
                if (lightningEnabled) {
                    startLightningBolts('gold', intensityMultiplier);
                }
            }
        }

        // Create fractal lightning bolt starting from edge with intensity
        function createFractalLightning(lightningType, intensityMultiplier = 1) {
            const runesBackground = document.getElementById('runesBackground');
            const lightning = document.createElement('div');
            lightning.className = `lightning-bolt ${lightningType}-lightning`;
            
            // Get viewport dimensions
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            
            // Create multiple lightning bolts from different edges based on intensity
            const baseBolts = 2;
            const maxBolts = Math.floor(baseBolts * intensityMultiplier) + Math.floor(Math.random() * 3);
            const numBolts = Math.min(maxBolts, 8); // Cap at 8 bolts maximum
            
            for (let i = 0; i < numBolts; i++) {
                // Randomly choose which edge to start from
                const edge = Math.floor(Math.random() * 4); // 0=top, 1=right, 2=bottom, 3=left
                let startX, startY;
                
                switch (edge) {
                    case 0: // Top edge
                        startX = Math.random() * viewportWidth;
                        startY = 0;
                        break;
                    case 1: // Right edge
                        startX = viewportWidth;
                        startY = Math.random() * viewportHeight;
                        break;
                    case 2: // Bottom edge
                        startX = Math.random() * viewportWidth;
                        startY = viewportHeight;
                        break;
                    case 3: // Left edge
                        startX = 0;
                        startY = Math.random() * viewportHeight;
                        break;
                }
                
                // Multiple target points for more complex patterns
                const targets = [
                    { x: viewportWidth / 2, y: viewportHeight / 2 }, // Center
                    { x: viewportWidth * 0.3, y: viewportHeight * 0.3 }, // Top-left area
                    { x: viewportWidth * 0.7, y: viewportHeight * 0.3 }, // Top-right area
                    { x: viewportWidth * 0.3, y: viewportHeight * 0.7 }, // Bottom-left area
                    { x: viewportWidth * 0.7, y: viewportHeight * 0.7 }  // Bottom-right area
                ];
                
                const target = targets[Math.floor(Math.random() * targets.length)];
                
                // Create fractal lightning tree with increased complexity based on intensity
                const maxDepth = Math.min(8 + Math.floor(intensityMultiplier * 2), 12); // Deeper fractals for higher intensity
                createLightningBranch(lightning, startX, startY, target.x, target.y, lightningType, 0, maxDepth);
            }
            
            runesBackground.appendChild(lightning);
            
            // Remove after animation completes
            setTimeout(() => {
                if (lightning.parentNode) {
                    lightning.parentNode.removeChild(lightning);
                }
            }, 1200);
        }

        // Create a lightning branch (recursive fractal)
        function createLightningBranch(container, startX, startY, targetX, targetY, lightningType, depth, maxDepth) {
            if (depth >= maxDepth) return;
            
            // Calculate distance and direction to target
            const dx = targetX - startX;
            const dy = targetY - startY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // If we're close enough to target, stop branching
            if (distance < 30) return;
            
            // More aggressive randomness for deeper fractals
            const angle = Math.atan2(dy, dx);
            const randomAngle = angle + (Math.random() - 0.5) * Math.PI / 2; // ±45 degrees
            const segmentLength = Math.min(distance * (0.2 + Math.random() * 0.3), 80 + Math.random() * 120);
            
            const endX = startX + Math.cos(randomAngle) * segmentLength;
            const endY = startY + Math.sin(randomAngle) * segmentLength;
            
            // Create lightning segment with varied thickness
            const segment = document.createElement('div');
            segment.className = 'lightning-segment';
            
            // Calculate segment properties
            const actualSegmentLength = Math.sqrt((endX - startX) ** 2 + (endY - startY) ** 2);
            const segmentAngle = Math.atan2(endY - startY, endX - startX) * 180 / Math.PI;
            
            // Varied thickness based on depth (thicker at base, thinner at tips)
            const thickness = Math.max(1, 6 - depth * 0.8 + Math.random() * 2);
            
            // Position and style the segment
            segment.style.left = startX + 'px';
            segment.style.top = startY + 'px';
            segment.style.width = actualSegmentLength + 'px';
            segment.style.height = thickness + 'px';
            segment.style.transformOrigin = '0 50%';
            segment.style.transform = `rotate(${segmentAngle}deg)`;
            
            // Add slight opacity variation for more organic look
            segment.style.opacity = 0.8 + Math.random() * 0.2;
            
            container.appendChild(segment);
            
            // Create multiple branches for more complex fractals
            if (depth < maxDepth - 1) {
                // Main branch continues toward target (higher probability)
                if (Math.random() < 0.8) {
                    createLightningBranch(container, endX, endY, targetX, targetY, lightningType, depth + 1, maxDepth);
                }
                
                // Multiple side branches with different probabilities
                const numSideBranches = Math.floor(Math.random() * 4); // 0-3 side branches
                
                for (let i = 0; i < numSideBranches; i++) {
                    if (Math.random() < 0.6) { // 60% chance for each potential branch
                        const sideAngle = randomAngle + (Math.random() - 0.5) * Math.PI * (0.5 + Math.random() * 0.5);
                        const sideLength = segmentLength * (0.2 + Math.random() * 0.6);
                        const sideEndX = endX + Math.cos(sideAngle) * sideLength;
                        const sideEndY = endY + Math.sin(sideAngle) * sideLength;
                        
                        // Create sub-branches with reduced max depth
                        createLightningBranch(container, endX, endY, sideEndX, sideEndY, lightningType, depth + 1, maxDepth - 1);
                    }
                }
                
                // Occasionally create micro-branches (very short, thin branches)
                if (Math.random() < 0.3 && depth < maxDepth - 2) {
                    const microAngle = randomAngle + (Math.random() - 0.5) * Math.PI;
                    const microLength = segmentLength * (0.1 + Math.random() * 0.2);
                    const microEndX = endX + Math.cos(microAngle) * microLength;
                    const microEndY = endY + Math.sin(microAngle) * microLength;
                    
                    // Create very short micro-branch
                    const microSegment = document.createElement('div');
                    microSegment.className = 'lightning-segment';
                    const microSegmentLength = Math.sqrt((microEndX - endX) ** 2 + (microEndY - endY) ** 2);
                    const microSegmentAngle = Math.atan2(microEndY - endY, microEndX - endX) * 180 / Math.PI;
                    
                    microSegment.style.left = endX + 'px';
                    microSegment.style.top = endY + 'px';
                    microSegment.style.width = microSegmentLength + 'px';
                    microSegment.style.height = '1px';
                    microSegment.style.transformOrigin = '0 50%';
                    microSegment.style.transform = `rotate(${microSegmentAngle}deg)`;
                    microSegment.style.opacity = 0.6;
                    
                    container.appendChild(microSegment);
                }
            }
        }

        // Start lightning bolt effects with intensity multiplier
        function startLightningBolts(lightningType, intensityMultiplier = 1) {
            // Clear any existing lightning intervals
            if (window.lightningInterval) {
                clearInterval(window.lightningInterval);
            }
            
            // Calculate lightning frequency based on intensity
            const baseChance = 0.2; // 20% base chance
            const lightningChance = Math.min(baseChance * intensityMultiplier, 0.8); // Cap at 80%
            const intervalTime = Math.max(1000 / intensityMultiplier, 200); // Faster intervals for higher intensity
            
            // Create fractal lightning bolts at random intervals
            window.lightningInterval = setInterval(() => {
                // Random chance to create lightning based on intensity
                if (Math.random() < lightningChance) {
                    createFractalLightning(lightningType, intensityMultiplier);
                }
            }, intervalTime);
        }

        // Stop lightning bolt effects
        function stopLightningBolts() {
            if (window.lightningInterval) {
                clearInterval(window.lightningInterval);
                window.lightningInterval = null;
            }
        }

        // Lightning toggle functionality
        function toggleLightning() {
            const button = document.getElementById('lightningToggleBtn');
            const isActive = button.classList.contains('active');
            
            if (isActive) {
                // Turn off lightning effects
                stopLightningBolts();
                button.classList.remove('active');
                button.textContent = '⚡';
                localStorage.setItem('lightningEnabled', 'false');
            } else {
                // Turn on lightning effects
                const portfolioData = loadPortfolioData();
                const stats = calculatePortfolioStats(portfolioData);
                const todayChangePercent = Math.abs(stats.todayChange);
                
                // Calculate intensity multiplier based on Today's Change percentage magnitude
                let intensityMultiplier = 1;
                if (todayChangePercent > 5) {
                    intensityMultiplier = 3;
                } else if (todayChangePercent > 3) {
                    intensityMultiplier = 2.5;
                } else if (todayChangePercent > 1) {
                    intensityMultiplier = 2;
                } else if (todayChangePercent > 0.5) {
                    intensityMultiplier = 1.5;
                }
                
                if (stats.todayChange > 1) {
                    startLightningBolts('green', intensityMultiplier);
                } else if (stats.todayChange < -1) {
                    startLightningBolts('red', intensityMultiplier);
                } else {
                    startLightningBolts('gold', intensityMultiplier);
                }
                
                button.classList.add('active');
                button.textContent = '⚡';
                localStorage.setItem('lightningEnabled', 'true');
            }
        }

        // Initialize lightning toggle state
        function initializeLightningToggle() {
            const button = document.getElementById('lightningToggleBtn');
            const lightningEnabled = localStorage.getItem('lightningEnabled');
            
            // Default to ON if no preference is set
            if (lightningEnabled === null || lightningEnabled === 'true') {
                button.classList.add('active');
                button.textContent = '⚡';
                localStorage.setItem('lightningEnabled', 'true');
            } else {
                button.classList.remove('active');
                button.textContent = '⚡';
            }
        }

        // Load portfolio data from localStorage
        function loadPortfolioData() {
            const saved = localStorage.getItem('portfolioData');
            if (saved) {
                return JSON.parse(saved);
            }
            return [];
        }

        // Calculate portfolio statistics (simplified version)
        function calculatePortfolioStats(portfolioData) {
            if (!portfolioData || portfolioData.length === 0) {
                return { todayChange: 0 };
            }

            const totalValue = portfolioData.reduce((sum, entry) => sum + (entry.value || 0), 0);
            
            // Calculate today's change using SUMPRODUCT(Total Allocation %, Today's Gain/Loss %)
            let sumproductTodayChange = 0;
            portfolioData.forEach((entry) => {
                if (entry.currentPrice && entry.previousClose && entry.shares) {
                    // Calculate allocation percentage
                    const allocationPercent = totalValue > 0 ? (entry.value / totalValue) * 100 : 0;
                    
                    // Calculate today's gain/loss percentage: ((current price - previous close) / current price) * 100
                    const priceChange = entry.currentPrice - entry.previousClose;
                    const todayGainLossPercent = entry.currentPrice ? (priceChange / entry.currentPrice) * 100 : 0;
                    
                    // SUMPRODUCT: allocation_percent * today_gain_loss_percent
                    sumproductTodayChange += (allocationPercent / 100) * todayGainLossPercent;
                }
            });

            return {
                todayChange: sumproductTodayChange
            };
        }

        // Load data from localStorage on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize lightning toggle state
            initializeLightningToggle();
            
            loadRiskData();
            renderTable();
            
            // Update runes background
            updateRunesBackground();
            
            // Add event listener for risk level description
            document.getElementById('riskLevel').addEventListener('change', function() {
                const riskLevel = this.value;
                const description = document.getElementById('riskDescription');
                if (riskLevel && riskDescriptions[riskLevel]) {
                    description.textContent = riskDescriptions[riskLevel];
                } else {
                    description.textContent = '';
                }
            });
        });

        function loadRiskData() {
            const saved = localStorage.getItem('riskData');
            if (saved) {
                riskData = JSON.parse(saved);
            }
        }

        function saveRiskData() {
            localStorage.setItem('riskData', JSON.stringify(riskData));
        }

        function renderTable() {
            const tbody = document.getElementById('riskTableBody');
            tbody.innerHTML = '';

            riskData.forEach((entry, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${entry.ticker}</td>
                    <td><span class="risk-level risk-${entry.riskLevel}">${entry.riskLevel}</span></td>
                    <td>${riskDescriptions[entry.riskLevel] || 'Unknown Risk Level'}</td>
                    <td>
                        <button class="btn btn-primary" onclick="editRiskEntry(${index})" style="padding: 5px 10px; font-size: 0.8rem; margin-right: 5px;">Edit</button>
                        <button class="btn btn-danger" onclick="deleteRiskEntry(${index})" style="padding: 5px 10px; font-size: 0.8rem;">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function openAddModal() {
            editingIndex = -1;
            document.getElementById('modalTitle').textContent = 'Add New Ticker';
            document.getElementById('riskForm').reset();
            document.getElementById('riskDescription').textContent = '';
            document.getElementById('riskModal').style.display = 'block';
        }

        function editRiskEntry(index) {
            editingIndex = index;
            const entry = riskData[index];
            
            document.getElementById('modalTitle').textContent = 'Edit Ticker Risk';
            document.getElementById('ticker').value = entry.ticker;
            document.getElementById('riskLevel').value = entry.riskLevel;
            document.getElementById('riskDescription').textContent = riskDescriptions[entry.riskLevel] || '';
            
            document.getElementById('riskModal').style.display = 'block';
        }

        function saveRiskEntry() {
            const form = document.getElementById('riskForm');
            const formData = new FormData(form);
            
            const entry = {
                ticker: formData.get('ticker').toUpperCase(),
                riskLevel: parseInt(formData.get('riskLevel'))
            };

            // Check if ticker already exists (case insensitive)
            const existingIndex = riskData.findIndex(item => 
                item.ticker.toUpperCase() === entry.ticker.toUpperCase() && item !== riskData[editingIndex]
            );

            if (existingIndex !== -1) {
                alert('This ticker already exists in the risk database!');
                return;
            }

            if (editingIndex === -1) {
                riskData.push(entry);
            } else {
                riskData[editingIndex] = entry;
            }

            saveRiskData();
            renderTable();
            closeModal();
        }

        function deleteRiskEntry(index) {
            if (confirm('Are you sure you want to delete this risk entry?')) {
                riskData.splice(index, 1);
                saveRiskData();
                renderTable();
            }
        }

        function closeModal() {
            document.getElementById('riskModal').style.display = 'none';
        }

        function clearAllRiskData() {
            if (confirm('Are you sure you want to clear all risk data? This cannot be undone.')) {
                riskData = [];
                saveRiskData();
                renderTable();
            }
        }

        function loadDefaultRiskData() {
            if (confirm('This will add default risk data for common tickers. Continue?')) {
                // Add default data only if ticker doesn't already exist
                defaultRiskData.forEach(defaultEntry => {
                    const exists = riskData.some(entry => 
                        entry.ticker.toUpperCase() === defaultEntry.ticker.toUpperCase()
                    );
                    if (!exists) {
                        riskData.push(defaultEntry);
                    }
                });
                saveRiskData();
                renderTable();
            }
        }

        function exportRiskData() {
            const dataStr = JSON.stringify(riskData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'risk-data.json';
            link.click();
            URL.revokeObjectURL(url);
        }

        function importRiskData() {
            document.getElementById('fileInput').click();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (confirm('This will replace all current risk data. Continue?')) {
                            riskData = importedData;
                            saveRiskData();
                            renderTable();
                        }
                    } catch (error) {
                        alert('Error importing file. Please make sure it\'s a valid JSON file.');
                    }
                };
                reader.readAsText(file);
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('riskModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>

    <!-- Glowing runes background -->
    <div class="runes-background" id="runesBackground"></div>
</body>
</html>
